{% extends 'base.html' %}
{% load socialaccount %}

{% block title %}Вход через Discord{% endblock %}

{% block content %}
<style>
    .auth-container {
        max-width: 500px;
        margin: 2rem auto;
    }
    
    .provider-info {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        padding: 2rem;
        background: linear-gradient(135deg, #5865F2 0%, #4752C4 100%);
        border-radius: 12px;
        margin-bottom: 2rem;
        color: white;
    }
    
    .provider-info svg {
        width: 48px;
        height: 48px;
    }
    
    .provider-info h2 {
        margin: 0;
        font-size: 24px;
    }
    
    .info-box {
        background: rgba(88, 101, 242, 0.1);
        border-left: 4px solid #5865F2;
        padding: 1rem;
        border-radius: 8px;
        margin-bottom: 1.5rem;
    }
    
    .info-box p {
        margin: 0;
        color: var(--text-secondary);
    }
    
    .btn-continue {
        width: 100%;
        padding: 14px;
        background: #5865F2;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-bottom: 1rem;
    }
    
    .btn-continue:hover {
        background: #4752C4;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(88, 101, 242, 0.3);
    }
    
    .btn-cancel {
        width: 100%;
        padding: 14px;
        background: transparent;
        color: var(--text-primary);
        border: 2px solid var(--border);
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: block;
        text-align: center;
    }
    
    .btn-cancel:hover {
        border-color: var(--accent);
        background: rgba(102, 126, 234, 0.1);
    }
</style>

<div class="auth-container">
    <div class="card">
        <div class="provider-info">
            <svg viewBox="0 0 24 24" fill="white">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"/>
            </svg>
            <h2>Вход через Discord</h2>
        </div>
        
        <div class="info-box">
            <p>🔒 Вы будете перенаправлены на Discord для авторизации. После успешного входа вы вернетесь на платформу.</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn-continue">
                Продолжить с Discord
            </button>
        </form>
        
        <a href="{% url 'accounts:login' %}" class="btn-cancel">
            Отмена
        </a>
    </div>
</div>
{% endblock %}
