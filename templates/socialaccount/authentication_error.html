{% extends 'base.html' %}

{% block title %}Ошибка входа{% endblock %}

{% block content %}
<style>
    .auth-container {
        max-width: 500px;
        margin: 2rem auto;
    }
    
    .error-icon {
        text-align: center;
        font-size: 64px;
        margin-bottom: 1rem;
    }
</style>

<div class="auth-container">
    <div class="card">
        <div class="error-icon">❌</div>
        <h1 style="text-align: center; margin-bottom: 1rem;">Ошибка входа</h1>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 2rem;">
            Произошла ошибка при попытке входа через Discord. Пожалуйста, попробуйте снова.
        </p>
        
        <a href="{% url 'accounts:login' %}" class="btn btn-primary" style="display: block; text-align: center; text-decoration: none;">
            Вернуться к входу
        </a>
    </div>
</div>
{% endblock %}
