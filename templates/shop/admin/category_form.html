

<!-- templates/shop/admin/category_form.html -->
{% extends 'base.html' %}
{% block title %}{% if category %}Редактирование{% else %}Создание{% endif %} категории{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-8 max-w-2xl">
    <div class="mb-6">
        <a href="{% url 'shop:admin_categories_list' %}" class="text-blue-600 hover:underline">← К списку категорий</a>
    </div>

    <div class="bg-white rounded-lg shadow-md p-8">
        <h1 class="text-3xl font-bold mb-6">{% if category %}Редактирование{% else %}Создание{% endif %} категории</h1>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block font-medium mb-2">Название категории *</label>
                <input type="text" name="name" required value="{% if category %}{{ category.name }}{% endif %}" 
                       class="w-full px-4 py-2 border rounded-lg">
            </div>

            <div>
                <label class="block font-medium mb-2">Slug *</label>
                <input type="text" name="slug" required value="{% if category %}{{ category.slug }}{% endif %}" 
                       class="w-full px-4 py-2 border rounded-lg" placeholder="league-services">
            </div>

            <div>
                <label class="block font-medium mb-2">Тип категории *</label>
                <select name="category_type" required class="w-full px-4 py-2 border rounded-lg">
                    <option value="league" {% if category and category.category_type == 'league' %}selected{% endif %}>Лига</option>
                    <option value="server" {% if category and category.category_type == 'server' %}selected{% endif %}>Игровой сервер</option>
                    <option value="other" {% if category and category.category_type == 'other' %}selected{% endif %}>Другое</option>
                </select>
            </div>

            <div>
                <label class="block font-medium mb-2">Описание</label>
                <textarea name="description" rows="3" class="w-full px-4 py-2 border rounded-lg">{% if category %}{{ category.description }}{% endif %}</textarea>
            </div>

            <div>
                <label class="block font-medium mb-2">Иконка (emoji)</label>
                <input type="text" name="icon" value="{% if category %}{{ category.icon }}{% endif %}" 
                       class="w-full px-4 py-2 border rounded-lg" placeholder="🎮">
            </div>

            <div>
                <label class="block font-medium mb-2">Порядок сортировки</label>
                <input type="number" name="order" value="{% if category %}{{ category.order }}{% else %}0{% endif %}" 
                       class="w-full px-4 py-2 border rounded-lg">
            </div>

            <div>
                <label class="flex items-center gap-2">
                    <input type="checkbox" name="is_active" {% if not category or category.is_active %}checked{% endif %}>
                    <span>Активна</span>
                </label>
            </div>

            <div class="flex gap-4 pt-6 border-t">
                <button type="submit" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    {% if category %}Сохранить изменения{% else %}Создать категорию{% endif %}
                </button>
                <a href="{% url 'shop:admin_categories_list' %}" class="px-6 py-3 border rounded-lg hover:bg-gray-50">
                    Отмена
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
